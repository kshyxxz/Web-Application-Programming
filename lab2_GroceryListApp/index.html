<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Grocery List</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="stylesheet" href="css/global.css" />
	</head>
	<body class="min-h-screen bg-gray-50 text-gray-900 antialiased">
		<h1 class="flex justify-center mt-7 text-4xl font-bold">
			Grocery List
		</h1>
		<div class="container mx-auto max-w-lg px-4 py-10">
			<div
				class="rounded-2xl bg-white border border-gray-200 shadow-lg p-6"
			>
				<div
					class="input_container flex justify-center items-center my-6"
				>
					<div
						class="input_box flex w-full max-w-md mx-auto gap-3 items-center"
					>
						<input
							type="text"
							class="inputItem flex-1 bg-gray-100 text-gray-900 text-lg border border-gray-300 px-4 py-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-500 transition"
							id="inputItem"
							placeholder="Enter grocery item..."
						/>
						<button
							class="addButton bg-slate-500 hover:bg-slate-600 active:scale-95 text-white px-5 py-2.5 rounded-xl text-lg font-medium shadow-sm transition-all"
							id="addButton"
						>
							Add
						</button>
					</div>
				</div>
				<div class="list_container">
					<div class="list_items flex flex-col gap-3"></div>
				</div>
			</div>
		</div>

		<script src="js/input_container.js" type="module" defer></script>
		<script src="js/list_container.js" type="module" defer></script>
	</body>
</html>
