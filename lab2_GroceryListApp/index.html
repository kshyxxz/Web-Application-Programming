<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Grocery List</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="stylesheet" href="css/global.css" />
	</head>
	<body class="min-h-screen bg-gray-950 text-gray-100 antialiased">
		<div class="container mx-auto max-w-lg px-4 py-10">
			<div
				class="rounded-2xl bg-gray-900 border border-gray-800 shadow-lg p-6 space-y-6"
			>
				<div class="input_container flex justify-center">
					<div class="input_box flex w-full gap-3 items-center">
						<input
							type="text"
							class="inputItem flex-1 bg-gray-800 text-gray-100 border border-gray-700 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-400 transition"
							id="inputItem"
							placeholder="Enter items for list..."
						/>
						<button
							class="addButton bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow transition-all"
							id="addButton"
						>
							Add
						</button>
					</div>
				</div>
				<div class="list_container">
					<div class="list_items flex flex-col gap-3"></div>
				</div>
			</div>
		</div>

		<script src="js/input_container.js" type="module" defer></script>
		<script src="js/list_container.js" type="module" defer></script>
	</body>
</html>
