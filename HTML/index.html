<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>WAP</title>
		<style>
			.parent {
				display: flex;
				flex-direction: row;
				width: 100%;
				height: 20vh;
				gap: 30px;
				/* justify-content: center; works in flex direction*/
				/* justify-content: start; */
				justify-content: space-between;
				/* justify-content: space-evenly; */
				align-items: center;
			}
			.child {
				flex: 0 0 100px;
				border: 2px solid black;
				background-color: fuchsia;
				width: 200px;
			}
			.child1 {
				align-self: center;
			}
		</style>
	</head>
	<body>
		<div class="parent">
			<div class="child child1">1</div>
			<div class="child child2">2</div>
			<div class="child child3">3</div>
		</div>
	</body>
</html>
