{% extends 'list_app/base.html' %}
{% block title %}{{ task.title }}{% endblock %}
{% block content %}
<h1>{{ task.title }}</h1>
<p class="text-muted">Created: {{ task.created_at|date:"SHORT_DATETIME_FORMAT" }}</p>
<a href="{% url 'list_app:todo_update' task.pk %}" class="btn btn-outline-secondary">Edit</a>
<a href="{% url 'list_app:todo_delete' task.pk %}" class="btn btn-outline-danger">Delete</a>
<a href="{% url 'list_app:todo_list' %}" class="btn btn-link">Back</a>
{% endblock %}
