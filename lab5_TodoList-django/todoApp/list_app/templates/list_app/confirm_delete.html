{% extends 'list_app/base.html' %} {% block title %}Delete Todo{% endblock %} {%
block content %}
<h1>Delete Todo</h1>
<p>Are you sure you want to delete "{{ task.title }}"?</p>
<form method="post">
	{% csrf_token %}
	<button type="submit" class="btn btn-danger">Yes, delete</button>
	<a href="{% url 'list_app:todo_list' %}" class="btn btn-secondary"
		>Cancel</a
	>
</form>
{% endblock %}
