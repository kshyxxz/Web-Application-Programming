<!doctype html>
<html>
	<body>
		<form onsubmit="return validate();">
			Name: <input type="text" id="name" /><br />
			Gender: <input type="radio" name="g" />M
			<input type="radio" name="g" />F<br />
			Hobbies: <input type="checkbox" />Sports
			<input type="checkbox" />Music<br />
			Date: <input type="datetime-local" id="date" /><br />
			Country:
			<select>
				<option>Nepal</option></select
			><br />
			Resume: <input type="file" id="file" /><br />
			Email: <input type="text" id="email" /><br />
			Phone: <input type="text" id="phone" /><br />
			Password: <input type="password" id="pass" /><br />
			Confirm: <input type="password" id="cpass" /><br />

			<input type="submit" />
		</form>

		<script>
			function validate() {
				let date = new Date(document.getElementById("date").value);
				if (date < new Date()) {
					alert("Past date not allowed");
					return false;
				}

				let file = document.getElementById("file").files[0];
				if (file && file.size > 2 * 1024 * 1024) {
					alert("File too big");
					return false;
				}

				let email = document.getElementById("email").value;
				if (!email.includes("@")) {
					alert("Invalid email");
					return false;
				}

				let phone = document.getElementById("phone").value;
				if (!/^(9\d{9}|01\d{7})$/.test(phone)) {
					alert("Invalid phone");
					return false;
				}

				let pass = document.getElementById("pass").value;
				if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*\W).{8,}/.test(pass)) {
					alert("Weak password");
					return false;
				}

				if (pass !== document.getElementById("cpass").value) {
					alert("Passwords do not match");
					return false;
				}

				return true;
			}
		</script>
	</body>
</html>
