<!doctype html>
<html>
	<style>
		#modal {
			display: none;
			position: fixed;
			top: 30%;
			left: 30%;
			background: white;
			padding: 20px;
			border: 1px solid black;
		}
	</style>

	<body>
		<button onclick="openModal()">Open</button>

		<div id="modal">
			<p>This is modal</p>
			<button onclick="closeModal()">Close</button>
		</div>

		<script>
			function openModal() {
				document.getElementById("modal").style.display = "block";
			}
			function closeModal() {
				document.getElementById("modal").style.display = "none";
			}
		</script>
	</body>
</html>
