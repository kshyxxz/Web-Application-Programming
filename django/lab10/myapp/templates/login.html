<h2>Student Login</h2>
{% if error %}
<p style="color: red">{{ error }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <p>
        <label for="username">Username:</label>
        <input id="username" type="text" name="username" required />
    </p>
    <p>
        <label for="password">Password:</label>
        <input id="password" type="password" name="password" required />
    </p>
    <button type="submit">Login</button>
</form>

<hr />
<p>
    <a href="{% url 'register' %}">User Registration</a> |
    <a href="{% url 'patient_form' %}">Patient Form</a> |
    <a href="{% url 'upload_file' %}">Image Upload</a> |
    <a href="{% url 'submit_project' %}">Project Submission</a> |
    <a href="{% url 'appointment' %}">Comprehensive Form</a> |
    <a href="{% url 'note_list' %}">Notes CRUD</a>
</p>
