<h2>Note Form - Kshitiz</h2>
{% if error %}
<p style="color: red">{{ error }}</p>
{% endif %}
<form method="POST">
	{% csrf_token %} Title:
	<input type="text" name="title" value="{{ note.title|default:'' }}" /><br />
	Content: <textarea name="content">{{ note.content|default:'' }}</textarea
	><br />
	<button type="submit">Save</button>
</form>
